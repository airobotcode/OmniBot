name: OmniBot CI/CD Multi-Platform Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "build/web"
      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: |
          cd build/app/outputs/flutter-apk/
          zip -r ../../../../omnibot-android-apks.zip *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-android
          path: omnibot-android-apks.zip

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: powershell
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "omnibot-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-windows
          path: omnibot-windows-x64.zip

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, "refs/tags/")
    needs: [build-android, build-windows, build-and-deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omnibot-android
      - uses: actions/download-artifact@v4
        with:
          name: omnibot-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OmniBot Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            omnibot-android-apks.zip
            omnibot-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

